org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
# Force IPv4 for the Gradle daemon/worker loopback socket. On this machine
# `localhost` resolves to ::1 (IPv6) first while the daemon binds IPv4, which
# caused "Unable to establish loopback connection". IPv4-only keeps them in sync.
systemProp.java.net.preferIPv4Stack=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36
kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
# android.builtInKotlin=false
# android.newDsl=true
