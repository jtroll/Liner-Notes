<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Back to Liner Notes</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e6e4e0;
           color: #1c1b1a; font: 17px/1.5 system-ui, sans-serif; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #121212; color: #ece9e4; } }
    main { padding: 24px; max-width: 22rem; }
    a.key { display: inline-block; margin-top: 16px; padding: 14px 22px; border-radius: 12px;
            background: #ff5a1f; color: #fff; text-decoration: none; font-weight: 600; }
    .hidden { display: none; }
  </style>
</head>
<body>
<main>
  <p id="going">Taking you back to Liner Notes&hellip;</p>
  <p id="missing" class="hidden">Last.fm didn't send an approval. Go back to the app and try connecting again.</p>
  <a id="open" class="key hidden" href="#">Open Liner Notes</a>
</main>
<script>
  // Last.fm sends people here after they approve the app, with ?token=. The token is useless
  // without the shared secret, which only the Cloud Function holds; this page just hands it to
  // the app through its own link.
  (function () {
    var token = new URLSearchParams(location.search).get("token");
    if (!token || !/^[A-Za-z0-9_-]{8,128}$/.test(token)) {
      document.getElementById("going").classList.add("hidden");
      document.getElementById("missing").classList.remove("hidden");
      return;
    }
    var link = "linernotes://lastfm-callback?token=" + encodeURIComponent(token);
    var open = document.getElementById("open");
    open.href = link;
    location.replace(link);
    setTimeout(function () { open.classList.remove("hidden"); }, 800);
  })();
</script>
</body>
</html>
