name: Android

# Builds the debug APK on every push to any branch (PRs come from branches in this repo, so each
# PR's builds run here too) and gets it onto J.T.'s phone two ways:
#   1. Firebase App Distribution (group "testers"), so App Tester offers the update. Needs
#      app/google-services.json committed and the FIREBASE_SERVICE_ACCOUNT secret.
#   2. A rolling GitHub prerelease called "latest-build" with LinerNotes.apk on it, which works
#      before Firebase exists at all (the app runs in its "setup needed" look-around mode).
# Every step that needs setup skips with a notice instead of failing, so the build goes green from
# the first push. docs/SETUP.md has the one-sitting setup.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write # the latest-build prerelease

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and send to the phone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public client values, from the repo's Actions variables (Settings > Secrets and variables >
      # Actions > Variables). Empty is fine: the app says what's missing.
      SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
      LASTFM_API_KEY: ${{ vars.LASTFM_API_KEY }}
      LASTFM_CALLBACK_URL: ${{ vars.LASTFM_CALLBACK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Use the shared debug signing key
        # Google sign-in only works for an APK signed by a key registered in Firebase. A runner
        # otherwise invents a fresh key every build, the APK installs fine and sign-in fails.
        # This is the same debug key Kerasma uses (docs/SETUP.md has its fingerprints).
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set, so this APK gets a throwaway key and Google sign-in will not work on it."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "LINERNOTES_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Check the signature Google will see
        id: signing
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          actual=$(grep -m1 'SHA-1 digest' <<<"$certs" | awk '{print $NF}' | tr 'A-Z' 'a-z')
          sha256=$(grep -m1 'SHA-256 digest' <<<"$certs" | awk '{print $NF}' | tr 'a-z' 'A-Z' | sed 's/../&:/g; s/:$//')
          echo "signed with SHA-1: $actual"
          # Firebase and Spotify want these fingerprints; they're printed on the run's summary page.
          echo "Signing certificate SHA-256 (for Firebase): \`$sha256\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Signing certificate SHA-1: \`$(printf '%s' "$actual" | tr 'a-z' 'A-Z' | sed 's/../&:/g; s/:$//')\`" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f app/google-services.json ]; then
            echo "::notice::No app/google-services.json yet, so the signature can't be checked against Firebase."
            exit 0
          fi
          expected=$(jq -r '[.client[] | select(.client_info.android_client_info.package_name == "com.trollman.linernotes") | .oauth_client[]? | select(.android_info) | .android_info.certificate_hash] | first // empty' app/google-services.json | tr 'A-Z' 'a-z')
          if [ -z "$expected" ]; then
            echo "::warning::google-services.json registers no SHA-1 for com.trollman.linernotes. Add the fingerprint in Firebase and download the file again."
          elif [ "$actual" != "$expected" ]; then
            echo "::error::This APK is signed with $actual but Firebase expects $expected, so Google sign-in would fail."
            exit 1
          fi

      - name: Stage the APK
        id: stage
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LinerNotes.apk
          {
            git log -1 --pretty=%s
            echo "Build ${{ github.run_number }} from $BRANCH ($(git rev-parse --short HEAD))"
          } > dist/notes.txt
          cat dist/notes.txt

      - name: Keep the APK on the run
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: LinerNotes-${{ github.run_number }}
          path: dist/LinerNotes.apk
          retention-days: 14

      - name: Publish to the latest-build prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view latest-build >/dev/null 2>&1; then
            gh release create latest-build --prerelease --title "Latest build" \
              --notes "The newest Liner Notes build from any branch. Download LinerNotes.apk on the phone to install."
          fi
          gh release upload latest-build dist/LinerNotes.apk --clobber
          gh release edit latest-build --notes "$(cat dist/notes.txt)

          Download LinerNotes.apk on the phone to install."

      - name: Send to App Tester
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TESTER_GROUP: ${{ vars.APP_DISTRIBUTION_GROUP || 'testers' }}
        run: |
          set -euo pipefail
          if [ ! -f app/google-services.json ] || [ -z "${SERVICE_ACCOUNT:-}" ]; then
            echo "::notice::App Distribution skipped: it needs app/google-services.json and the FIREBASE_SERVICE_ACCOUNT secret (docs/SETUP.md)."
            exit 0
          fi
          app_id=$(jq -r '[.client[] | select(.client_info.android_client_info.package_name == "com.trollman.linernotes") | .client_info.mobilesdk_app_id] | first // empty' app/google-services.json)
          if [ -z "$app_id" ]; then
            echo "::error::google-services.json has no app for com.trollman.linernotes."
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15 appdistribution:distribute dist/LinerNotes.apk \
            --app "$app_id" --groups "$TESTER_GROUP" --release-notes-file dist/notes.txt
          rm -f "$RUNNER_TEMP/sa.json"
